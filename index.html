<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Map Explorer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🗺️%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--ink:#10303f;--mist:#eef4f4;--line:#cfdede;--sea:#1b7a99;--amber:#f2b134;--route:#e4572e;--bg:#fff;--tx:#10303f;--mu:#5b7482}
@media(prefers-color-scheme:dark){:root{--bg:#10303f;--tx:#eef4f4;--mu:#9bb5c1;--line:#25495a;--mist:#173b4c}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font:15px/1.4 "Avenir Next","Century Gothic","Trebuchet MS",sans-serif;color:var(--tx)}
#map{position:absolute;inset:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:1px}
#panel{position:absolute;z-index:1000;top:12px;left:12px;width:370px;max-width:calc(100% - 24px);max-height:calc(100% - 24px);display:flex;flex-direction:column;background:var(--bg);border-radius:14px;box-shadow:0 6px 28px rgba(16,48,63,.35);overflow:hidden}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--ink);color:#eef4f4}
.top b{font-size:18px;letter-spacing:.3px}
.top b i{font-style:normal;color:var(--amber)}
.seg{display:flex;background:#0b2230;border-radius:20px;padding:3px}
.seg button{border:0;background:none;color:#9bb5c1;padding:5px 14px;border-radius:16px}
.seg button.on{background:var(--amber);color:var(--ink);font-weight:700}
section{padding:12px 14px;overflow:auto}
form{display:flex;gap:6px}
input{flex:1;min-width:0;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--mist)}
input:focus{border-color:var(--sea);outline:none}
.go,form button{border:0;background:var(--sea);color:#fff;border-radius:10px;padding:10px 14px;font-weight:700}
#vR input{width:100%;margin-bottom:8px}
.modes{display:flex;gap:6px;margin:2px 0 10px}
.modes button{flex:1;padding:8px;border:1.5px solid var(--line);border-radius:10px;background:none}
.modes button.on{border-color:var(--sea);background:var(--sea);color:#fff}
#vR .go{width:100%}
ul,ol{margin:10px 0 0;padding:0;list-style:none}
#list li{padding:9px 6px;border-top:1px solid var(--line);cursor:pointer}
#list li:hover,#list li:focus{background:var(--mist)}
#list small,#card p,.c,#steps small{color:var(--mu)}
#list small{display:block}
#card h3{margin:12px 0 2px;font-size:19px}
#card p{margin:2px 0}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.btns button{border:1.5px solid var(--sea);background:none;color:var(--sea);border-radius:18px;padding:6px 12px;font-weight:600}
.btns button:first-child{background:var(--sea);color:#fff}
#sum{margin-top:12px;font-size:17px;font-weight:700}
#sum span{color:var(--route)}
#steps{max-height:36vh;overflow:auto;counter-reset:s}
#steps li{padding:7px 0 7px 28px;border-top:1px solid var(--line);position:relative}
#steps li:before{counter-increment:s;content:counter(s);position:absolute;left:0;top:8px;width:20px;height:20px;border-radius:50%;background:var(--mist);font-size:11px;text-align:center;line-height:20px}
#ctl{position:absolute;z-index:1000;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
#ctl button{width:42px;height:42px;border:0;border-radius:10px;background:var(--bg);box-shadow:0 2px 10px rgba(16,48,63,.3);font-size:20px}
#lay{position:absolute;z-index:1000;left:12px;bottom:26px;display:flex;gap:6px;background:var(--bg);padding:6px;border-radius:12px;box-shadow:0 2px 10px rgba(16,48,63,.3)}
#lay button{border:2px solid transparent;border-radius:8px;background:var(--mist);padding:6px 10px;font-size:13px}
#lay button.on{border-color:var(--amber);font-weight:700}
#toast{position:absolute;z-index:1100;left:50%;bottom:80px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:20px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
@media(max-width:600px){#panel{width:auto;right:12px}#ctl{top:auto;bottom:90px}#lay{bottom:12px}}
.brand{display:flex;align-items:center;gap:9px}
#logo{height:34px;border-radius:8px;background:#fff;padding:2px 3px}
#col{border:0;background:none;color:#9bb5c1;font-size:18px;margin-left:4px}
#panel.min section{display:none}
:root[data-t=light]{--bg:#fff;--tx:#10303f;--mu:#5b7482;--line:#cfdede;--mist:#eef4f4}
:root[data-t=dark]{--bg:#10303f;--tx:#eef4f4;--mu:#9bb5c1;--line:#25495a;--mist:#173b4c}
#hist li,#fav li{padding:8px 6px;border-top:1px solid var(--line);cursor:pointer;display:flex;justify-content:space-between;gap:8px}
#hist li:hover,#fav li:hover{background:var(--mist)}
#fav small{color:var(--mu);display:block}
#cats{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
#cats button{border:1.5px solid var(--line);background:none;border-radius:16px;padding:4px 10px;font-size:13px}
#cats button:hover{border-color:var(--sea)}
.btns a{border:1.5px solid var(--sea);color:var(--sea);border-radius:18px;padding:6px 12px;font-weight:600;text-decoration:none}
#ctl button.on{background:var(--amber)}
#ctl{max-height:calc(100% - 24px);overflow:auto}
#steps li{cursor:pointer}
#hud{position:absolute;z-index:1000;left:50%;bottom:8px;transform:translateX(-50%);background:rgba(16,48,63,.85);color:#fff;font-size:12px;padding:3px 10px;border-radius:10px;pointer-events:none}
#hud:empty{display:none}
body{font-family:var(--ff,"Avenir Next","Century Gothic","Trebuchet MS",sans-serif)}
:root{--pin:#f2b134;--pinS:#10303f}
#uim{position:absolute;z-index:1100;right:62px;bottom:12px;background:var(--bg);border-radius:12px;box-shadow:0 4px 18px rgba(16,48,63,.35);padding:6px;display:flex;flex-direction:column;gap:2px}
#lgm{position:absolute;z-index:1100;right:62px;top:12px;background:var(--bg);border-radius:12px;box-shadow:0 4px 18px rgba(16,48,63,.35);padding:6px;display:flex;flex-direction:column;gap:2px}
  
#uim button,#lgm button{border:0;background:none;text-align:left;padding:8px 14px;border-radius:8px;white-space:nowrap}
#uim button:hover,#uim button.on,#lgm button:hover,#lgm button.on{background:var(--mist);font-weight:700}
/* Interfaz tipo Google Maps */
:root[data-ui=google]{--sea:#1a73e8;--amber:#1a73e8;--route:#4285f4;--pin:#ea4335;--pinS:#a50e0e;--ff:Roboto,Arial,sans-serif}
[data-ui=google] #panel{border-radius:8px;box-shadow:0 2px 6px rgba(60,64,67,.35)}
[data-ui=google] .top{background:var(--bg);color:var(--tx);border-bottom:1px solid var(--line)}
[data-ui=google] .top b i,[data-ui=google] #col{color:#1a73e8}
[data-ui=google] .seg{background:var(--mist)}
[data-ui=google] .seg button{color:var(--mu)}
[data-ui=google] .seg button.on{background:#1a73e8;color:#fff}
[data-ui=google] input{border-radius:24px;background:var(--bg);box-shadow:0 1px 4px rgba(60,64,67,.3);border-color:transparent}
[data-ui=google] form button,[data-ui=google] .go{border-radius:24px}
[data-ui=google] #ctl button{border-radius:50%}
/* Interfaz tipo Apple Maps */
:root[data-ui=apple]{--sea:#0a84ff;--amber:#0a84ff;--route:#0a84ff;--pin:#ff3b30;--pinS:#fff;--ff:-apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif}
[data-ui=apple] #panel,[data-ui=apple] #lay,[data-ui=apple] #ctl button{background:color-mix(in srgb,var(--bg) 72%,transparent);-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6)}
[data-ui=apple] #panel{border-radius:20px}
[data-ui=apple] .top{background:transparent;color:var(--tx)}
[data-ui=apple] .top b i,[data-ui=apple] #col{color:#0a84ff}
[data-ui=apple] .seg{background:color-mix(in srgb,var(--mist) 80%,transparent)}
[data-ui=apple] .seg button{color:var(--mu)}
[data-ui=apple] .seg button.on{background:#0a84ff;color:#fff}
[data-ui=apple] input{border-radius:12px;border-color:transparent;background:color-mix(in srgb,var(--mist) 85%,transparent)}
[data-ui=apple] #ctl button{border-radius:12px}
/* Interfaz tipo Waze */
:root[data-ui=waze]{--sea:#1ab7f0;--amber:#ffd24d;--route:#33ccff;--pin:#33ccff;--pinS:#07293d;--ff:Nunito,"Trebuchet MS",Verdana,sans-serif}
[data-ui=waze] #panel{border-radius:26px}
[data-ui=waze] .top{background:#33ccff;color:#07293d}
[data-ui=waze] .top b i{color:#fff;text-shadow:0 1px 0 #0a7fb0}
[data-ui=waze] #col{color:#07293d}
[data-ui=waze] .seg{background:rgba(255,255,255,.55)}
[data-ui=waze] .seg button{color:#07293d}
[data-ui=waze] .seg button.on{background:#fff;color:#07293d}
[data-ui=waze] input{border-radius:22px}
[data-ui=waze] form button,[data-ui=waze] .go,[data-ui=waze] .btns button:first-child,[data-ui=waze] .modes button.on{border-radius:22px;color:#07293d;font-weight:800;background:#33ccff}
[data-ui=waze] #ctl button,[data-ui=waze] #lay{border-radius:18px}
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- Mapa y capas ---------- */
const map=L.map("map",{zoomControl:false}).setView([23.6,-102.5],5);
L.control.scale({imperial:false,position:"bottomright"}).addTo(map);
const LAYERS={
  calles:["Mapa",L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,attribution:"Mapa © Esri, HERE, Garmin, OpenStreetMap"})],
  sat:["Satélite",L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,attribution:"Imágenes © Esri"})],
  relieve:["Relieve",L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,attribution:"Mapa © Esri, USGS, NOAA"})],
  oscuro:["Oscuro",L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,maxNativeZoom:16,attribution:"Mapa © Esri, HERE, Garmin"})]
};
let base;
function setBase(k){
  base&&map.removeLayer(base);
  base=LAYERS[k][1].addTo(map);
  document.querySelectorAll("#lay button").forEach(b=>b.classList.toggle("on",b.dataset.k===k));
  try{localStorage.mxLayer=k}catch(e){}
}
for(const k in LAYERS){
  const b=document.createElement("button");
  b.textContent=LAYERS[k][0];b.dataset.k=k;b.onclick=()=>setBase(k);
  $("#lay").append(b);
}
let saved="calles";try{saved=localStorage.mxLayer||"calles"}catch(e){}
setBase(LAYERS[saved]?saved:"calles");

const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.id);toast.id=setTimeout(()=>t.classList.remove("show"),2800)};
$("#zi").onclick=()=>map.zoomIn();
$("#zo").onclick=()=>map.zoomOut();

/* ---------- Posición en el enlace ---------- */
map.on("moveend",()=>{const c=map.getCenter();history.replaceState(null,"","#"+map.getZoom()+"/"+c.lat.toFixed(5)+"/"+c.lng.toFixed(5))});
const h=location.hash.match(/^#(\d+)\/(-?[\d.]+)\/(-?[\d.]+)/);
if(h)map.setView([+h[2],+h[3]],+h[1]);

/* ---------- Ubicación ---------- */
const me=()=>new Promise((ok,no)=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>ok([p.coords.latitude,p.coords.longitude]),()=>no("No pude obtener tu ubicación. Revisa los permisos del navegador."),{enableHighAccuracy:true,timeout:10000}):no("Tu navegador no tiene geolocalización."));
let dot;
$("#loc").onclick=async()=>{
  try{
    const p=await me();
    dot&&map.removeLayer(dot);
    dot=L.circleMarker(p,{radius:8,color:"#fff",weight:3,fillColor:"#1b7a99",fillOpacity:1}).addTo(map);
    map.flyTo(p,15);
  }catch(e){toast(e)}
};

/* ---------- Búsqueda ---------- */
const NOM="https://nominatim.openstreetmap.org/";
const geo=async q=>(await fetch(NOM+"search?format=jsonv2&limit=6&accept-language=es&q="+encodeURIComponent(q))).json();
const rev=async(la,lo)=>(await fetch(NOM+"reverse?format=jsonv2&accept-language=es&lat="+la+"&lon="+lo)).json();
const fromNom=r=>({lat:+r.lat,lon:+r.lon,name:r.name||String(r.display_name).split(",")[0],addr:r.display_name});

let mk,sel;
function place(p,fly=true){
  sel=p;
  mk&&map.removeLayer(mk);
  mk=L.marker([p.lat,p.lon],{icon:PIN}).addTo(map).bindPopup("<b>"+esc(p.name)+"</b>");
  if(fly)map.flyTo([p.lat,p.lon],Math.max(map.getZoom(),15));
  const c=$("#card");c.hidden=false;
  c.innerHTML=`<h3>${esc(p.name)}</h3><p>${esc(p.addr)}</p><p class="c">${p.lat.toFixed(5)}, ${p.lon.toFixed(5)}</p>
  <div class="btns"><button id="cb">Cómo llegar</button><button id="cf">Salir de aquí</button><button id="cs">Copiar enlace</button></div>`;
  $("#cb").onclick=()=>useAs("b");
  $("#cf").onclick=()=>useAs("a");
  $("#cs").onclick=()=>navigator.clipboard.writeText(location.origin+location.pathname+"#16/"+p.lat.toFixed(5)+"/"+p.lon.toFixed(5)).then(()=>toast("Enlace copiado"),()=>toast("No se pudo copiar"));
}
$("#fS").onsubmit=async e=>{
  e.preventDefault();
  const q=$("#q").value.trim();if(!q)return;
  $("#list").innerHTML="<li>Buscando…</li>";$("#card").hidden=true;
  try{
    const r=await geo(q);
    if(!r.length){$("#list").innerHTML="<li>Sin resultados para «"+esc(q)+"». Prueba con otra ciudad o dirección.</li>";return}
    $("#list").innerHTML="";
    r.forEach(x=>{
      const p=fromNom(x),li=document.createElement("li");

const resolve=async i=>{
  if(i.ll)return i.ll;
  const v=i.value.trim();
  if(!v)throw "Escribe el origen y el destino.";
  if(/^mi ubicaci/i.test(v))return me();
  const r=await geo(v);
  if(!r[0])throw "No encontré «"+v+"».";
  return [+r[0].lat,+r[0].lon];
};
const fD=m=>m<1000?Math.round(m)+" m":(m/1000).toFixed(m<10000?1:0)+" km";
const fT=s=>{const m=Math.round(s/60);return m<60?m+" min":Math.floor(m/60)+" h "+(m%60)+" min"};
const MOD={left:"a la izquierda",right:"a la derecha",straight:"recto","slight left":"ligeramente a la izquierda","slight right":"ligeramente a la derecha","sharp left":"cerrado a la izquierda","sharp right":"cerrado a la derecha",uturn:"en U"};
function say(s){
  const m=s.maneuver,t=m.type,d=MOD[m.modifier]||"",r=s.name?" por "+s.name:"";
  if(t==="depart")return "Sal"+r;
  if(t==="arrive")return "Llegas a tu destino";
  if(t==="roundabout"||t==="rotary")return "Entra en la rotonda y sal"+r;
  if(/turn|end of road|fork|off ramp|on ramp/.test(t))return "Gira "+d+r;
  return "Sigue "+(d||"recto")+r;
}
$("#go").onclick=async()=>{
  $("#sum").textContent="Calculando…";$("#steps").innerHTML="";
  try{
    const [A,B]=await Promise.all([resolve($("#a")),resolve($("#b"))]);
    const u=`https://routing.openstreetmap.de/routed-${prof}/route/v1/driving/${A[1]},${A[0]};${B[1]},${B[0]}?overview=full&geometries=geojson&steps=true`;
    const j=await (await fetch(u)).json();
    if(!j.routes||!j.routes[0])throw "No hay una ruta posible entre esos puntos.";
    const r=j.routes[0];
    routeL&&map.removeLayer(routeL);ends.forEach(x=>map.removeLayer(x));
    routeL=L.geoJSON(r.geometry,{style:{color:"#fff",weight:10,opacity:.9}}).addTo(map);
    window.rl2&&map.removeLayer(rl2);rl2=L.geoJSON(r.geometry,{style:{color:getComputedStyle(document.documentElement).getPropertyValue("--route").trim()||"#e4572e",weight:6}}).addTo(map).bringToFront();
    ends=[L.circleMarker(A,{radius:7,color:"#fff",weight:3,fillColor:"#1b7a99",fillOpacity:1}).addTo(map),L.circleMarker(B,{radius:7,color:"#fff",weight:3,fillColor:"#e4572e",fillOpacity:1}).addTo(map)];
    map.fitBounds(routeL.getBounds(),{padding:[70,70]});

    $("#steps").innerHTML=r.legs[0].steps.map(s=>`<li data-ll="${s.maneuver.location[1]},${s.maneuver.location[0]}">${esc(say(s))} <small>${fD(s.distance)}</small></li>`).join("");

};

function stepTr(c){
  let m;
  if(m=c.match(/^Sal(?: por (.+))?$/)){const r=m[1];return [r?"Head out on "+r:"Head out",r?"Siga por "+r:"Siga",r?"Partez par "+r:"Partez",r?r+"を出発":"出発"][K]}
  if(m=c.match(/^Entra en la rotonda y sal(?: por (.+))?$/)){const r=m[1];return ["Enter the roundabout and exit"+(r?" onto "+r:""),"Entre na rotatória e saia"+(r?" em "+r:""),"Entrez dans le rond-point et sortez"+(r?" sur "+r:""),"ロータリーに入り"+(r?r+"方面へ出る":"出る")][K]}
  if((m=c.match(/^(Gira|Sigue) (.+?)(?: por (.+))?$/))&&MD[m[2]]){
    const w=MD[m[2]][K],r=m[3],t=m[1]==="Gira";
    return [(t?"Turn ":"Continue ")+w+(r?(t?" onto ":" on ")+r:""),(t?"Vire ":"Siga ")+w+(r?" em "+r:""),(t?"Tournez ":"Continuez ")+w+(r?" sur "+r:""),w+(w==="Uターン"?"する":w==="まっすぐ"?"進む":t?"に曲がる":"へ進む")+(r?"（"+r+"）":"")][K];
  }
  return null;
}
function rules(c){
  for(const [re,a] of RULES){const m=c.match(re);if(m&&a[K])return a[K].replace(/\$(\d)/g,(_,i)=>D[m[i]]?D[m[i]][K]:m[i])}
  return stepTr(c);
}
function tr(s){
  const m=s.match(/^(\s*)([\s\S]*?)(\s*)$/),c=m[2];
  if(!c)return s;
  let o=D[c]?D[c][K]:null;
  if(o==null){const e=c.match(/^([^\p{L}\d]+\s)(.+)$/u);if(e&&D[e[2]])o=e[1]+D[e[2]][K]}
  if(o==null)o=rules(c);
  return o==null?s:m[1]+o+m[3];
}
function walk(n){
  if(n.nodeType===3){const t=tr(n.nodeValue);if(t!==n.nodeValue)n.nodeValue=t;return}
  if(n.nodeType!==1||/^(SCRIPT|STYLE|TEXTAREA)$/.test(n.tagName))return;
  for(const a of ["placeholder","aria-label","title"]){const v=n.getAttribute(a);if(v){const t=tr(v);if(t!==v)n.setAttribute(a,t)}}
  n.childNodes.forEach(walk);
}
